<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Map | BruchinDB</title>

  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.2.1/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="./style.css" />
</head>

<body>

  <!-- Top Nav Bar -->
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="../search-page/index.html">
        <img src="./icons/bruchindb-logo.png" alt="BruchinDB logo" class="brand-logo" />
        <span class="brand-name">BruchinDB</span>
      </a>

      <nav class="nav" aria-label="Primary">
        <a class="nav-link" href="../search-page/index.html">Search</a>
        <a class="nav-link active" href="../map-page/index.html">Map</a>
        <a class="nav-link" href="../loading-page/index.html">Learn</a>
        <a class="nav-link" href="../data-submission-page/index.html">Submit Data</a>
        <a class="nav-link" href="../about-page/index.html">About</a>
      </nav>
    </div>
  </header>

  <div class="search-layout" id="searchLayout">

    <!-- LEFT FILTER PANEL -->
    <aside class="filter-panel" id="filterPanel">
      <!-- Scientific Name -->
      <div class="filter-section">
        <div class="filter-title" data-section-toggle>
          Scientific Name
          <span class="arrow">&#9662;</span>
        </div>
        <div class="filter-content">
          <input type="text" id="map-sci-name-search" placeholder="Enter scientific name..." />
        </div>
      </div>

      <!-- Tribe -->
      <div class="filter-section">
        <div class="filter-title" data-section-toggle>
          Tribe
          <span class="arrow">&#9662;</span>
        </div>
        <div class="filter-content">
          <select id="map-filter-tribe">
            <option value="">Any tribe</option>
          </select>
        </div>
      </div>

      <!-- Location -->
      <div class="filter-section">
        <div class="filter-title" data-section-toggle>
          Location
          <span class="arrow">&#9662;</span>
        </div>
        <div class="filter-content">
          <div class="location-group">
            <input type="text" id="map-filter-country" placeholder="Country..." />
          </div>
          <div class="location-group">
            <input type="text" id="map-filter-province" placeholder="Province / State..." />
          </div>
          <div class="location-group">
            <input type="text" id="map-filter-locality" placeholder="Locality..." />
          </div>
          <div class="location-group">
            <input type="number" id="map-filter-elevation-min" placeholder="Minimum elevation (m)..." min="0" />
          </div>
        </div>
      </div>

      <!-- Host Plant -->
      <div class="filter-section">
        <div class="filter-title" data-section-toggle>
          Host Plant
          <span class="arrow">&#9662;</span>
        </div>
        <div class="filter-content">
          <input type="text" id="map-filter-host" placeholder="Enter host plant..." />
          <select id="map-filter-host-family">
            <option value="">Select family</option>
            <option>Fabaceae</option>
            <option>Poaceae</option>
            <option>Asteraceae</option>
          </select>
        </div>
      </div>

      <!-- Image-Only Species -->
      <div class="filter-section">
        <div class="filter-title" data-section-toggle>
          Image-Only Species
          <span class="arrow">&#9662;</span>
        </div>
        <div class="filter-content">
          <label class="checkbox-label">
            <span class="checkbox-text">Show only species with images</span>
            <span class="checkbox-box">
              <input type="checkbox" id="map-filter-images-only" />
            </span>
          </label>
        </div>
      </div>

      <div class="filter-actions">
        <button type="button" id="mapSearchBtn" class="btn-primary">Search</button>
        <button type="button" id="mapResetBtn" class="btn-secondary">Reset</button>
      </div>

    </aside>

    <!-- MAP PANEL -->
    <main class="results-panel">
      <div class="view-toolbar">
        <button type="button" class="view-btn" id="filtersToggleBtn">Filters</button>
      </div>
      <div id="map"></div>
    </main>

  </div>

  <script>
    document.querySelectorAll('[data-section-toggle]').forEach((title) => {
      title.addEventListener('click', () => {
        const content = title.nextElementSibling;
        const arrow = title.querySelector('.arrow');
        if (!content || !arrow) return;
        content.classList.toggle('open');
        arrow.classList.toggle('rotate');
      });
    });

    const filtersToggleBtn = document.getElementById('filtersToggleBtn');
    const searchLayout = document.getElementById('searchLayout');
    if (filtersToggleBtn && searchLayout) {
      if (localStorage.getItem('mapFiltersCollapsed') === 'true') {
        searchLayout.classList.add('filters-collapsed');
      }
      filtersToggleBtn.addEventListener('click', () => {
        searchLayout.classList.toggle('filters-collapsed');
        localStorage.setItem('mapFiltersCollapsed', searchLayout.classList.contains('filters-collapsed'));
        window.setTimeout(() => window.map?.resize(), 180);
      });
    }
  </script>

  <script src="https://unpkg.com/maplibre-gl@3.2.1/dist/maplibre-gl.js"></script>
  <script type="module" src="./map.js"></script>

</body>
</html>
