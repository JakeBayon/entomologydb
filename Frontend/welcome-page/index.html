  <link rel="stylesheet" href="./style.css" />

<body class="welcome-body">
  <main class="welcome-page">

    <!-- Moving image mosaic background -->
    <section class="beetle-mosaic" aria-hidden="true">
      <div class="mosaic-row row-left" id="row-1"></div>
      <div class="mosaic-row row-right" id="row-2"></div>
      <div class="mosaic-row row-left" id="row-3"></div>

    <!-- Soft overlay -->

    <!-- Center hero content -->

        </div>

        <div class="hero-copy">

          <p class="welcome-subtitle">Sharing seed beetle data globally</p>

          <div class="welcome-actions">
            <a href="../search-page/index.html" class="welcome-btn welcome-btn-solid" data-login-transition>Login</a>
            <a href="#" class="welcome-btn welcome-btn-outline">Sign Up</a>
          </div>

          <a href="#" class="guest-link">Continue as guest</a>
        </div>
      </div>
    </section>

    <!-- Database vault transition shown before routing to the search page. -->
    <div class="page-transition-overlay" aria-hidden="true">
      <div class="search-zoom-preview">

            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>

        <div class="preview-search-layout">
          <aside class="preview-filters">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </aside>
          <main class="preview-results">
            <div class="preview-toolbar"></div>
            <div class="preview-card-grid">
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
            </div>
          </main>
        </div>
      </div>
      <div class="transition-half transition-half-top"></div>
      <div class="transition-half transition-half-bottom"></div>
      <div class="transition-flash"></div>
    </div>

  </main>

    const loginButton = document.querySelector("[data-login-transition]");
    const transitionOverlay = document.querySelector(".page-transition-overlay");

    // Keep navigation accessible: reduced-motion users and no-JS users go straight to Search.
    if (loginButton && transitionOverlay) {
      loginButton.addEventListener("click", (event) => {
        const searchUrl = loginButton.href;
        const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        if (prefersReducedMotion) {
          return;
        }

        event.preventDefault();

        if (document.body.classList.contains("is-transitioning")) {
          return;
        }

        document.body.classList.add("is-transitioning");
        transitionOverlay.setAttribute("aria-hidden", "false");

        window.setTimeout(() => {
          window.location.href = searchUrl;
        }, 1250);
      });
    }

    function shuffleArray(array) {
      const shuffled = [...array];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    function makeMixedSequence(images, repeatCount = 2) {
      const result = [];

      for (let r = 0; r < repeatCount; r++) {
        let shuffled = shuffleArray(images);

        if (result.length > 0 && shuffled[0] === result[result.length - 1]) {
          shuffled.push(shuffled.shift());
        }

        result.push(...shuffled);
      }

      return result;
    }

    function buildRow(rowId) {
      const row = document.getElementById(rowId);

      const mixedImages = makeMixedSequence(beetleImages, 2);

      mixedImages.forEach((src, index) => {
        const card = document.createElement("div");
        card.className = "mosaic-card";

        const sizeClasses = ["tile-wide", "tile-tall", "tile-medium", "tile-small"];
        card.classList.add(sizeClasses[index % sizeClasses.length]);

        const img = document.createElement("img");
        img.src = src;
        img.alt = "";
        img.loading = "lazy";

        card.appendChild(img);
        row.appendChild(card);
      });
    }

    buildRow("row-1");
    buildRow("row-2");
    buildRow("row-3");
    buildRow("row-4");
